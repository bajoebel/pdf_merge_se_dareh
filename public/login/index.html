<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Login - Claim Document Merger</title>
    <!-- Bootstrap 3 -->
    <link
        rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    >
    <style>
        html,
        body {
            height: 100%;
        }
        body {
            margin: 0;
            font-family:
                "Helvetica Neue",
                Helvetica,
                Arial,
                sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #f4f7fb 0%,
                    #e8eef7 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .login-wrapper {
            width: 100%;

            max-width: 420px;

            padding: 20px;
        }


        .login-card {
            background: #fff;

            border-radius: 16px;

            padding: 40px 35px 35px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.10);
        }


        .login-logo {
            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #337ab7,
                    #23527c
                );

            color: #fff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            box-shadow:
                0 8px 20px
                rgba(51, 122, 183, 0.30);
        }


        .login-title {
            text-align: center;

            margin-bottom: 5px;

            font-weight: 600;

            color: #263238;
        }


        .login-subtitle {
            text-align: center;

            color: #90a4ae;

            font-size: 13px;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-control {
            height: 46px;

            border-radius: 8px;

            border: 1px solid #dce3ea;

            box-shadow: none;

            padding-left: 42px;
        }


        .form-control:focus {
            border-color: #337ab7;

            box-shadow:
                0 0 0 3px
                rgba(51, 122, 183, 0.10);
        }


        .input-icon {
            position: absolute;

            left: 15px;

            top: 15px;

            color: #90a4ae;

            z-index: 3;
        }


        .input-wrapper {
            position: relative;
        }


        .btn-login {
            width: 100%;

            height: 46px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #337ab7,
                    #286090
                );

            color: #fff;

            font-size: 15px;

            font-weight: 600;

            transition: all .2s ease;
        }


        .btn-login:hover,
        .btn-login:focus {
            color: #fff;

            transform:
                translateY(-1px);

            box-shadow:
                0 6px 15px
                rgba(51, 122, 183, 0.25);
        }


        .login-footer {
            text-align: center;

            margin-top: 25px;

            color: #b0bec5;

            font-size: 12px;
        }


        #loginError {
            display: none;

            border-radius: 8px;

            margin-bottom: 20px;
        }


        .loading {
            display: none;
        }

    </style>

</head>


<body>


<div class="login-wrapper">

    <div class="login-card">


        <div class="login-logo">

            <span class="glyphicon glyphicon-lock"></span>

        </div>


        <h3 class="login-title">
            Claim Document Merger
        </h3>


        <div class="login-subtitle">
            Silakan login untuk melanjutkan
        </div>


        <div
            id="loginError"
            class="alert alert-danger"
        ></div>


        <form id="loginForm">


            <div class="form-group">

                <label>
                    Username
                </label>

                <div class="input-wrapper">

                    <span
                        class="glyphicon glyphicon-user input-icon"
                    ></span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="input-wrapper">

                    <span
                        class="glyphicon glyphicon-lock input-icon"
                    ></span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                id="btnLogin"
                class="btn btn-login"
            >

                <span class="normal">
                    Login
                </span>

                <span class="loading">
                    <span
                        class="glyphicon glyphicon-refresh"
                    ></span>

                    Memproses...
                </span>

            </button>


        </form>


        <div class="login-footer">

            Claim Document Merger

        </div>


    </div>

</div>


<!-- jQuery -->
<script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
></script>


<!-- Bootstrap 3 -->
<script
    src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"
></script>


<script>

$(function () {
    $('#loginForm').on(
        'submit',
        function (e) {
            e.preventDefault();
            var username =
                $('#username').val().trim();
            var password =
                $('#password').val();
            $('#loginError')
                .hide()
                .text('');
            $('#btnLogin')
                .prop('disabled', true);
            $('.normal')
                .hide();
            $('.loading')
                .show();
            $.ajax({
                url: '/login/login',
                method: 'POST',
                contentType:
                    'application/json',
                data: JSON.stringify({
                    username: username,
                    password: password
                }),
                success: function (response) {
                    if (
                        response.success
                    ) {
                        window.location.href =
                            response.redirect ||
                            '/file-manager';
                    }
                },
                error: function (xhr) {
                    var message =
                        'Username atau password salah';
                    if (
                        xhr.responseJSON &&
                        xhr.responseJSON.message
                    ) {
                        message =
                            xhr.responseJSON.message;
                    }
                    $('#loginError')
                        .text(message)
                        .fadeIn(200);
                },
                complete: function () {
                    $('#btnLogin')
                        .prop('disabled', false);
                    $('.normal')
                        .show();
                    $('.loading')
                        .hide();
                }
            });
        }
    );
    $('#username').focus();
});
</script>
</body>
</html>
